name: CI
on: [push, pull_request]

jobs:
  test:
    name: Dub Test
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-15-intel
        dc:
          - dmd-2.112.0
          - ldc-1.42.0

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1.4.0
        with:
          compiler: ${{ matrix.dc }}

      - name: Run tests
        run: dub test -q --build=unittest-cov #-c asan

      - name: Build binary
        run: dub build -q

      - uses: codecov/codecov-action@v7
